<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard de Ventas</title>
    <link rel="stylesheet" href="css/sweetalert2.min.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="img/icono.webp" type="image/png" />
  </head>
  <body>
    <header class="header-principal">
      <h1 class="titulo-con-icono">
        <img src="img/dashboard.svg" alt="Icono Dashboard" class="icono" />
        Dashboard de Ventas
      </h1>
      <p class="descripcion-header">
        Registro dinámico de ventas en tiempo real con Chart.js y SweetAlert2.
      </p>
    </header>

    <!-- Navegación de regreso a las secciones principales -->
    <nav>
      <a href="index.html#graficas">Gráficas</a>
      <a href="index.html#alertas">Alertas</a>
      <a href="index.html#inputs">Inputs</a>
      <a href="index.html#especiales">Especiales</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>

    <main>
      <section>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 border-bottom pb-3 mb-4">
          <h2 class="titulo-seccion border-0 p-0 m-0">
            <img src="img/dashboard.svg" alt="Icono Dashboard" class="icono-seccion" />
            Ventas Mensuales
          </h2>
          <a href="index.html" class="btn btn-volver">← Volver al inicio</a>
        </div>

        <p>Presiona el botón para registrar nuevas unidades y actualizar la gráfica al instante.</p>

        <div class="contenedor-grafica contenedor-grafica-grande mt-4">
          <canvas id="grafica"></canvas>
        </div>

        <div class="mt-4">
          <button class="btn botoncito" id="btnAgregar">Añadir venta</button>
        </div>
      </section>
    </main>

    <script src="js/chart.umd.min.js"></script>
    <script src="js/sweetalert2@11.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
